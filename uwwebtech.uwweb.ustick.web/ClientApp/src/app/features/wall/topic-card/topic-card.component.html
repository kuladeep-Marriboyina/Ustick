<div class="bc-wrap {{ stageKey }}" [class.peeling]="peeling" [class.is-mastered]="isMastered" [class.locked]="!due && !isMastered">
  <!-- dashed ghost left on the wall when the card peels off -->
  <span class="wall-ghost" aria-hidden="true"></span>

  <article class="bigcard">
    <!-- lifting paper corner -->
    <span class="peel" aria-hidden="true"></span>
    <span class="peel-shadow" aria-hidden="true"></span>

    <div class="bc-top">
      <div class="bc-eyebrow">
        <span class="subject">{{ note.subjectName }}</span>
        <span class="chip">{{ meta.label }}</span>
      </div>

      <div class="arc">
        <svg viewBox="0 0 64 64" width="64" height="64">
          <circle class="arc-track" cx="32" cy="32" [attr.r]="ringRadius"></circle>
          <circle class="arc-value" cx="32" cy="32" [attr.r]="ringRadius"
                  [attr.stroke-dasharray]="circumference"
                  [attr.stroke-dashoffset]="dashOffset"></circle>
        </svg>
        <span class="arc-num" *ngIf="!isMastered">{{ note.mastery }}<i>%</i></span>
        <span class="arc-num check" *ngIf="isMastered">✓</span>
      </div>
    </div>

    <h2 class="bc-title">{{ note.topicName }}</h2>
    <p class="bc-take">{{ note.customNote || note.takeaway }}</p>

    <div class="bc-streak" *ngIf="!isMastered && note.strongStreak > 0">
      <span class="pip" *ngFor="let d of [0,1,2,3]" [class.on]="d < note.strongStreak"></span>
      <span class="pip-label">{{ note.strongStreak }} strong pass{{ note.strongStreak === 1 ? '' : 'es' }}</span>
    </div>

    <div class="bc-foot">
      <ng-container *ngIf="!isMastered">
        <button *ngIf="due" class="btn btn-primary big-retest" (click)="onRetest()">
          Retest <span class="arrow">→</span>
        </button>
        <span *ngIf="!due" class="locked-chip">🔒 Unlocks in {{ daysLeft }}d</span>
      </ng-container>
      <span *ngIf="isMastered" class="mastered-badge">🎓 Mastered</span>
    </div>
  </article>
</div>
